<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brewtine</title>
  <meta name="theme-color" content="#F5EBDD">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header class="top">
      <h1>Brewtine</h1>
      <p id="today-label" class="today"></p>
    </header>

    <form id="habit-form" novalidate>
      <label for="habit-name" class="sr-only">Habit name</label>
      <input id="habit-name" type="text" maxlength="60" autocomplete="off"
             placeholder="New habit, e.g. Study 1 hour">
      <label for="weekly-target" class="sr-only">Days per week</label>
      <select id="weekly-target">
        <option value="1">1 day a week</option>
        <option value="2">2 days a week</option>
        <option value="3">3 days a week</option>
        <option value="4">4 days a week</option>
        <option value="5">5 days a week</option>
        <option value="6">6 days a week</option>
        <option value="7" selected>7 days a week</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <p id="form-error" class="error" role="alert" hidden></p>

    <p id="loading" class="empty">Loading your habits…</p>
    <p id="empty-state" class="empty" hidden>Add your first habit to get started.</p>
    <ul id="habit-list"></ul>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
